version: 0.2

phases:
  pre_build:
    commands:
      - export COMMIT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - export IMAGE_TAG_SHA=$ECR_REPO_URI:$COMMIT_SHA
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI

  build:
    commands:
      - docker buildx build --platform linux/amd64 -t $IMAGE_TAG_SHA .

  post_build:
    commands:
      - docker push $IMAGE_TAG_SHA
      - printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":3000,"HostPort":80}]}' $IMAGE_TAG_SHA > Dockerrun.aws.json

artifacts:
  files:
    - Dockerrun.aws.json
